syntax = "proto3";

package enrollment;

service EnrollmentService {
  rpc createEnrollment (CreateEnrollmentRequest) returns (EnrollmentResponse);
  rpc listEnrollmentsByStudent (ListEnrollmentsByStudentRequest) returns (ListEnrollmentsByStudentResponse);
}

// ─── Messages ────────────────────────────────────────────────────────────────

message Enrollment {
  int32  id         = 1;
  string student_id = 2;
  int32  course_id  = 3;
  string status     = 4;
}

message CreateEnrollmentRequest {
  string student_id = 1;
  int32  course_id  = 2;
}

// EnrollmentResponse bọc object Enrollment (nhất quán với CourseResponse)
message EnrollmentResponse {
  Enrollment enrollment = 1;
}

message ListEnrollmentsByStudentRequest {
  string student_id = 1;
}

message ListEnrollmentsByStudentResponse {
  repeated Enrollment enrollments = 1;
}
